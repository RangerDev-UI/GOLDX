name: GOLDX tests
on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test market gateway and indicators
        run: node --test tests/*.test.cjs
      - name: Validate Cloudflare Worker bundling without deploying
        run: npx --yes wrangler@4.165.0 deploy --dry-run --outdir=/tmp/goldx-worker-bundle
